name: ci

# D68: 기본 토큰 권한을 읽기로 좁힌다. 이 저장소는 릴리스를 태그로만 하고 워크플로가 콘텐츠를
# 쓰지 않으므로 contents: read로 충분하다 — GitHub Release를 채널로 쓰기 시작하면 이 값을
# 함께 재검토한다(설계 v0.13 D68).
# 핀 갱신은 정기 주기를 두지 않는다 — 핀된 액션의 보안 권고나 그 액션이 필요해지는 기능
# 변경이 트리거다. 주기적 갱신은 핀의 목적(의도한 시점에만 움직인다)을 되돌린다.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod

      # csharp 러너(internal/exec) 실행 테스트용 .NET 10 보장 — ubuntu/macos 이미지엔 부재.
      # setup-dotnet은 프리인스톨을 먼저 확인 후 스킵하므로 windows 조건 분기 없이 3-OS 무조건으로 둔다.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: 10.0.x

      # js/ts·python 러너도 같은 이유로 명시 설치한다 — node/npm/python은 러너 이미지 프리인스톨에
      # 의존했고 bun은 아예 없었다. 미감지 toolchain은 t.Skip이라 D65 사용자 구성 격리 실증이
      # 초록 속에서 조용히 빠질 수 있다. 세 액션 모두 setup-dotnet과 같이 3-OS 무조건이다.

      # node: npm 실증(TestNpmrcScratchConfigWins)의 구성 해석 주체가 node 배포에 딸려 오고,
      # 22 라인은 TS 게이트 ≥22.7을 충족한다(개발기 실측 v22.19.0). 라인만 고정하고 패치는
      # 흘린다 — 그 실증은 격리 없는 절반이 호스트 registry를 못 보면 Fatal이라 패치 이동이
      # 거짓 초록을 만들지 못한다.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'

      # bun: 이미지에 없어 TestRunJSScratchBunfigWins가 3-OS 전부 Skip이었다(bunfig 갈래 미검증).
      # detect가 bun을 먼저 고르므로 이 설치로 CI의 js/ts 실행이 node에서 bun 경로로 바뀐다 —
      # bun이 기본 러너라는 계약대로다(node 쪽은 npm 실증으로 남는다). 정확 버전으로 고정한다:
      # exec.go의 bunfig 관측이 1.3.14 실측이고 이 테스트는 픽스처 무효 시 Fatal이 아니라 Skip이라,
      # 버전이 흐르면 실증이 초록 속에서 조용히 없어진다. 올리는 일은 커밋으로 드러낸다.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      # python: user site·pip.conf 실증(TestRunPyScratchUserSiteWins)용. 개발기 실측 3.14.2와 같은
      # 라인에 두고 패치는 흘린다 — 이 실증은 픽스처 무효 시 Fatal이라 조용한 통과 경로가 없다.
      # 따옴표 필수: 3.10 같은 값은 YAML 부동소수로 해석돼 3.1로 잘린다.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'

      # 아래 두 실행의 -count=1: setup-go의 기본 캐시는 빌드 산출물만이 아니라 테스트 결과까지
      # 복원한다. 없으면 초록 체크가 "실행됐다"가 아니라 "지난 런에서 캐시됐다"를 뜻할 수 있다 —
      # v0.11 이후 main의 windows 런은 internal/sandbox를 매번 ok (cached)로 찍었고, 타임아웃이
      # 프로세스 트리를 죽이는지 지키는 windows 전용 테스트는 그 초록들 동안 한 번도 실행되지
      # 않았다. 그 안의 회귀는 이 브랜치에서 소스 변경이 캐시 키를 깨뜨린 뒤에야 드러났다.
      # 개발기에서 돌 수 없는 OS별 코드(landlock/SBPL, 러너별 격리)의 유일한 검증 경로가 이
      # 런이라 캐시 재사용은 검증의 부재와 같다 — 중복으로 보여도 지우지 말 것.

      # 메모리 캡 규율(CLAUDE.md): 전체 스위트는 -p 1 필수.
      # store 2-프로세스 경합, transform worker RLIMIT_AS/트리킬 서브프로세스 테스트를 포함해
      # 3-OS에서 처음 실행된다 — ubuntu/macos 로그가 unix RLIMIT_AS self-apply 실측(게이트 8)이다.
      - name: go test -p 1 -count=1
        run: go test -p 1 -count=1 ./...

      # CGO 가용 러너에서만 -race 추가 실행(게이트 7 동시성 심층).
      - name: go test -p 1 -count=1 -race (ubuntu only)
        if: runner.os == 'Linux'
        run: go test -p 1 -count=1 -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod

      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@v0.10.0

      - name: gofumpt diff check
        run: |
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then
            echo "gofumpt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: "golangci-lint (v2, default: standard + misspell)"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

      # D69: 기본 lint는 한 GOOS의 파일 집합만 본다 — windows 전용 파일 4개(ident/realpath_windows.go,
      # transform/worker_windows.go, store/store_lock_windows.go, sandbox/run_windows.go)가 ubuntu
      # 런에서 대상 밖이었다. 액션과 같은 버전을 직접 설치해 GOOS=windows로 한 번 더 돈다.
      # 취득 방식 근거: 이 잡이 이미 gofumpt를 go install로 받으므로(ci.yml:84) 관례와 같다.
      # 액션을 SHA 핀해 한 번 더 쓰고 그 스텝에만 env: GOOS를 주는 대안이 D68의 공급망 고정과
      # 더 일관되지만, 한 잡에서 액션 두 번 실행의 캐시 동작과 env 전달이 미검증이다 — 그쪽으로
      # 옮기는 것은 그 두 가지를 확인한 뒤로 미룬다. 버전은 부동 prefix가 아닌 정확 패치로 고정한다.
      - name: install golangci-lint (action과 동일 계열, 정확 패치)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # 판정 1단계: 대상 파일이 실제로 범위에 있는지 먼저 확인한다. 이 확인 없이 통과만 보면
      # 스텝이 그 파일을 못 봐도 초록이다(설계 v0.13 D69).
      - name: verify windows-only files are in lint scope
        run: |
          set -euo pipefail
          for pkg in ./internal/ident ./internal/transform ./internal/store ./internal/sandbox; do
            # herestring으로 grep에 직접 먹인다 — "$files"를 echo로 파이프하면 pipefail 아래에서
            # grep 조기 종료가 echo에 SIGPIPE를 줘 파이프라인이 비영이 되고 매칭 성공이 실패로
            # 뒤집힐 수 있다(64KiB 넘는 payload로 재현). herestring은 파이프 자체가 없어 이
            # 경합이 구조적으로 없다.
            files="$(GOOS=windows go list -f '{{join .GoFiles "\n"}}' "$pkg")"
            if ! grep -q '_windows\.go$' <<<"$files"; then
              echo "no windows-only file in lint scope for $pkg"
              exit 1
            fi
          done

      # 판정 2단계: 포함이 확인된 뒤의 결과를 받는다.
      # golangci-lint를 이름으로만 부르면 앞선 golangci-lint-action이 PATH 앞에 자체 바이너리를
      # 얹었을 때 그쪽이 우선될 수 있어 위 "정확 패치로 고정" 의도가 실행 시점에 성립하지 않을
      # 수 있다 — go install이 심은 경로를 직접 가리켜 실행 바이너리를 확정한다.
      # 기본 상한(--max-same-issues=3)은 동일 메시지를 3건까지만 출력한다 — 이 절삭이 앞선 두
      # 세션에서 같은 lint 결과를 4건·13건으로 서로 다르게 기록하게 만든 원인이었다. 상한을
      # 풀어 CI 로그가 전체 목록을 보이게 한다(exit code 판정 자체는 절삭과 무관하게 정확했다).
      - name: golangci-lint (GOOS=windows)
        run: GOOS=windows "$(go env GOPATH)/bin/golangci-lint" run --max-same-issues=0 --max-issues-per-linter=0 ./...

      # D79(v0.14): darwin·netbsd·perf 축을 더해 미검출 집합을 비운다. D69가 GOOS=windows
      # 축을 세우고 남긴 잔여는 정확히 세 파일이었다 — internal/sandbox/launcher_darwin.go,
      # internal/sandbox/launcher_other.go, internal/search/perf_test.go.
      #
      # 판정은 **세 단계**다. D69의 두 단계 앞에 빌드 확인이 붙는다: 그 GOOS에서 전
      # 패키지가 빌드되지 않으면 golangci-lint는 typechecking error와 함께 "0 issues."를
      # 내며 종료 코드만 실패한다 — 스코프 확인(2단계)은 초록인데 lint가 **다른 패키지**에서
      # 죽는 형태다. freebsd가 정확히 그랬다(worker_unix.go의 syscall.Rlimit이 그 GOOS에서
      # int64라 !windows 갈래가 통째로 컴파일되지 않는다). netbsd는 소스 변경 0으로
      # 성립하고 같은 !windows && !linux && !darwin 갈래라 미검출 집합을 동일하게 닫는다.
      # openbsd는 syscall.RLIMIT_AS 미정의로 불가하다.
      - name: verify darwin/netbsd/perf axes build and are in lint scope
        run: |
          set -euo pipefail
          for goos in darwin netbsd; do
            if ! GOOS=$goos go build ./...; then
              echo "GOOS=$goos build failed — this lint axis does not hold (see design v0.14 D79)"
              exit 1
            fi
          done
          # perf 축만 go build가 아니다 — go build는 _test.go를 컴파일하지 않고 이 저장소에서
          # perf 태그가 거는 파일은 internal/search/perf_test.go 하나뿐이라, go build -tags perf는
          # 태그 없는 빌드와 같은 집합을 컴파일해 이 축에 대해 항상 통과한다(리뷰 실측).
          # -run '^$'는 테스트 본문을 하나도 실행하지 않고 테스트 바이너리까지 링크하므로 실패가
          # 곧 컴파일 실패다. go vet도 태그 붙은 테스트 파일을 보지만 golangci-lint의 기본 linter에
          # govet이 이미 들어 있어 그 실패 출력은 3단계의 lint 소견과 구분되지 않는다 — 1단계가
          # 존재하는 이유가 바로 그 신호 분리다. -p 1은 test 잡과 같은 메모리 캡 규율이고,
          # 본문이 하나도 실행되지 않아 비용은 사실상 없다.
          if ! go test -tags perf -run '^$' -p 1 ./...; then
            echo "-tags perf test compile failed — this lint axis does not hold"
            exit 1
          fi
          # perf 축의 스코프 확인은 형태가 다르다 — .GoFiles는 _test.go를 포함하지 않아
          # perf_test.go를 볼 수 없다. .TestGoFiles/.XTestGoFiles를 본다. 두 join 사이의
          # {{"\n"}}은 필수다 — 없으면 외부 테스트 파일이 생겼을 때 .TestGoFiles의 마지막
          # 항목과 .XTestGoFiles의 첫 항목이 한 줄로 붙어 줄 끝 앵커($) 매칭이 어긋난다
          # (stdlib strings로 실측: export_test.gobuilder_test.go).
          files="$(GOOS=darwin go list -f '{{join .GoFiles "\n"}}' ./internal/sandbox)"
          if ! grep -q 'launcher_darwin\.go$' <<<"$files"; then
            echo "launcher_darwin.go not in darwin lint scope"
            exit 1
          fi
          files="$(GOOS=netbsd go list -f '{{join .GoFiles "\n"}}' ./internal/sandbox)"
          if ! grep -q 'launcher_other\.go$' <<<"$files"; then
            echo "launcher_other.go not in netbsd lint scope"
            exit 1
          fi
          files="$(go list -tags perf -f '{{join .TestGoFiles "\n"}}{{"\n"}}{{join .XTestGoFiles "\n"}}' ./internal/search)"
          if ! grep -q 'perf_test\.go$' <<<"$files"; then
            echo "perf_test.go not in perf lint scope"
            exit 1
          fi

      - name: golangci-lint (GOOS=darwin)
        run: GOOS=darwin "$(go env GOPATH)/bin/golangci-lint" run --max-same-issues=0 --max-issues-per-linter=0 ./...

      - name: golangci-lint (GOOS=netbsd)
        run: GOOS=netbsd "$(go env GOPATH)/bin/golangci-lint" run --max-same-issues=0 --max-issues-per-linter=0 ./...

      # `run:` 값이 큰따옴표로 시작하면 YAML이 그것을 이중따옴표 스칼라로 파싱하고 닫는
      # 따옴표 뒤를 처리하지 못한다 → **ci.yml 전체가 파싱 오류**가 되어 lint 잡뿐 아니라
      # 워크플로의 모든 잡이 로드되지 않는다(검수 실측). 기존 D69 스텝과 위 두 축은 값이
      # `GOOS=…`로 시작해 평문 스칼라라 무사하고, perf 스텝만 앞에 붙는 것이 없어 따옴표가
      # 선두로 온다 — `env`를 앞세워 평문 스칼라로 만든다.
      - name: golangci-lint (--build-tags perf)
        run: env "$(go env GOPATH)/bin/golangci-lint" run --build-tags perf --max-same-issues=0 --max-issues-per-linter=0 ./...

  # D70: test 잡은 bun을 설치하므로 detectJS가 항상 bun을 고른다 — node 레그가 CI에서 한 번도
  # 실행되지 않았다. bun을 설치하지 않는 잡에서 js·ts 러너를 돌린다. 판정은 통과 여부가 아니라
  # 응답의 runner 라벨이며(TestRunnerLabelNodeLeg), 그 단정이 없으면 bun 잡을 한 번 더 돌린
  # 것과 구분되지 않는다.
  test-node-leg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod

      # test 잡과 같은 라인 — TS 게이트 ≥22.7을 충족한다. bun은 설치하지 않는다(이 잡의 존재 이유).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'

      # F1(리뷰 2026-07-27): 이 잡은 "bun 미해석 → node 레그"를 전제로 서 있는데 그 전제를
      # 검증하지 않으면, 러너 이미지가 bun을 들고 오거나 이 잡에 bun 스텝이 붙어도 조용히
      # 초록으로 남는다 — TestRunnerLabelNodeLeg는 Skip되고 TestRunTS·TestRunJSIsolatesUserConfig는
      # bun으로 실행되어 node 레그 커버리지 0인 채로 잡이 성공한다(설계 D70이 막으려던 실패
      # 모드 그 자체). set -e 아래서 `command -v bun`을 조건문 밖에 두면 부재(원하는 상태)가
      # 스크립트를 즉시 죽인다 — if 조건 안에 둬 그 함정을 피한다. node 버전도 로그에 남기고
      # TS 게이트(≥22.7)를 여기서 확정한다 — 미달이면 requireLang이 Skip이라 CI 로그에서만
      # (그것도 무음으로) 드러나던 것을 하드 실패로 승격한다(무음 Skip을 남기지 않는다).
      - name: verify job premise (bun absent, node meets TS gate)
        run: |
          set -euo pipefail
          if command -v bun >/dev/null 2>&1; then
            echo "bun resolved on PATH ($(command -v bun)) — this job exists to cover the node leg without bun; remove the bun install or fix the runner image" >&2
            exit 1
          fi
          node_version="$(node --version)"
          echo "node version: $node_version"
          ver="${node_version#v}"
          major="${ver%%.*}"
          minor="${ver#*.}"
          minor="${minor%%.*}"
          # fail-closed 파싱 가드(Go의 nodeAtLeast와 방향 일치) — 아래 [ -lt ] 비교가
          # 비숫자에서 내는 오류는 if 조건 안에서 삼켜져 게이트가 조용히 통과(exit 0)할
          # 수 있다. 비교 전에 먼저 걸러 그 경로를 막는다.
          case "$major$minor" in ''|*[!0-9]*) echo "unparseable node version: $node_version" >&2; exit 1;; esac
          if [ "$major" -lt 22 ] || { [ "$major" -eq 22 ] && [ "$minor" -lt 7 ]; }; then
            echo "node $node_version does not meet the TypeScript gate (>=22.7 required by detectTS) — TestRunTS/TestRunnerLabelNodeLeg's typescript subtest would silently Skip via requireLang instead of failing; fix setup-node's node-version input" >&2
            exit 1
          fi

      - name: go test (js·ts 러너 — node 레그)
        run: go test -p 1 -count=1 ./internal/exec/ -run 'TestRunTS|TestRunJSIsolatesUserConfig|TestRunnerLabelNodeLeg' -v

  crossbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod

      # CGO_ENABLED=0 6타깃(게이트 12) — modernc.org/sqlite는 순수 Go라 CGO 불필요.
      # 바이너리 크기를 Step Summary에 기록한다.
      - name: crossbuild 6 targets + size summary
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "### crossbuild binary sizes"
            echo ""
            echo "| target | bytes |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            out="dist/ctr-${goos}-${goarch}${ext}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/context-router
            size=$(stat -c%s "$out")
            echo "| ${goos}/${goarch} | ${size} |" >> "$GITHUB_STEP_SUMMARY"
          done

  # D56(스펙 v0.10): 태그와 바이너리 ProductVersion 일치 검증 — -dev 잔존 태그 차단.
  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod
      - name: verify tag matches ProductVersion
        run: |
          got="$(go run ./cmd/context-router version)"
          want="${GITHUB_REF_NAME#v}"
          test "$got" = "$want" || { echo "version mismatch: binary=$got tag=$want"; exit 1; }
